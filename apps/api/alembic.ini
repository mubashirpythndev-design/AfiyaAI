# Alembic configuration for Afiya AI backend.
# The database URL is resolved in alembic/env.py with this priority:
#   1. sqlalchemy.url set on the Config (e.g. by tests)
#   2. AFIYA_ALEMBIC_DATABASE_URL environment variable
#   3. app settings DATABASE_URL (.env)

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Left empty on purpose — resolved at runtime (see env.py).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
